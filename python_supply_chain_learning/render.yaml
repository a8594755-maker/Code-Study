services:
  - type: web
    name: supply-sql-lab
    runtime: node
    rootDir: tools/sql_playground
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.11.1
      - key: DATABASE_SCHEMA
        value: olist
      - key: SUPABASE_URL
        value: https://ylmuvsdegmpoiygbtipi.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
